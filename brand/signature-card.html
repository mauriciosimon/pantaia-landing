<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:#0a0d14}
.card{width:560px;height:184px;box-sizing:border-box;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f1219 0%,#0a0d14 70%);border:1px solid #1f2533;font-family:Inter,Arial,sans-serif;color:#e8ecf3}
.glow{position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(45,212,191,.22),rgba(59,130,246,.10) 55%,transparent 72%)}
.row{position:absolute;left:28px;top:30px;display:flex;align-items:center;gap:16px}
.name{font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:22px}
.role{font-size:13px;color:#8b96a8;margin-top:3px}
.role b{color:#c3cbd8;font-weight:600}
.hero{position:absolute;left:28px;top:104px;font-size:16px;font-weight:700;letter-spacing:-.01em;background:linear-gradient(90deg,#2fe0c8,#3d8bfd);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:20px}
.tag{position:absolute;left:28px;top:126px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#93c5fd;font-weight:500}
.contact{position:absolute;left:28px;bottom:16px;font-size:12.5px;color:#8b96a8}
.contact .dot{color:#2fe0c8;padding:0 8px}
.contact .site{color:#c3cbd8;font-weight:500}
.rule{position:absolute;left:28px;right:28px;top:92px;height:1px;background:linear-gradient(90deg,rgba(47,224,200,.45),rgba(61,139,253,.25),transparent)}
</style></head><body>
<div class="card">
  <div class="glow"></div>
  <div class="row">
    <img src="../img/mark-240.png" width="52" height="52" alt="">
    <div><div class="name">Mauricio S. López</div><div class="role">Founder, <b>Pantaia</b></div></div>
  </div>
  <div class="rule"></div>
  <div class="hero">Reimagine your screen</div>
  <div class="tag">AI-native Enterprise Design</div>
  <div class="contact">mauricio@pantaia.com<span class="dot">·</span><span class="site">pantaia.com</span></div>
</div></body></html>
